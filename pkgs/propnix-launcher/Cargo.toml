[package]
name = "propnix-launcher"
version = "0.1.0"
edition = "2021"
description = "Per-app launcher for propnix winefex apps: GTK4 splash + single-instance + env-seal + prefix assembly + orchestration"

[[bin]]
name = "propnix-launcher"
path = "src/main.rs"

[dependencies]
# GTK4 for the startup splash. gtk4-rs 0.9 baselines GTK 4.14 API and builds against the newer 4.22 in
# the pin. Re-exports glib/gio/gdk, so we don't depend on them separately.
gtk4 = "0.9"
# The launcher↔wrapper config (a writeText JSON baked by makeAppWinefex).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# flock (single-instance), killpg (teardown backstop), process-group signalling. Tiny, stable, no C build.
libc = "0.2"
# The mount + prefetch helpers, LINKED as libraries (compiled in) rather than exec'd as separate binaries:
# `propnix_mount::enter_and_mount` runs in a Command::pre_exec hook on the mount child; `propnix_prefetch::warm`
# runs on a detached thread. Path deps in a Cargo workspace (see ../Cargo.toml).
propnix-mount = { path = "../propnix-mount" }
propnix-prefetch = { path = "../propnix-prefetch" }
# gamescope's nested X server: the game-window watcher (run::watch_window) and focus requests
# (gamescope::activate).
x11rb = "0.13"
wayland-client = "0.31"
# The primary output's current mode + logical position (to pick the primary): core wl_output plus
# xdg-output-unstable-v1 (`unstable`), deriving the PROPNIX_WIDTH/HEIGHT runtime facts (display.rs).
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

[profile.release]
# The launcher is glue; optimise for a small, quick-to-build binary rather than peak throughput.
opt-level = "s"
